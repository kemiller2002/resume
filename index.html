<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kevin Miller · Resume</title>

    <!-- Folio print/layout vocabulary, pinned to a commit and verified with SRI. -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/kemiller2002/folio@b5e9af78afaf002b97b9d8463418597118f42a6d/src/styles/print.css"
        integrity="sha384-wPHeYH8X/Nxu4Lg1xuv2QUHJj2VnEQLKWGIc/WjdWgutXJ9auLFl9XNNzOkiHq3B"
        crossorigin="anonymous" data-folio>
    <link rel="stylesheet" href="resume.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.1/knockout-latest.js"
        integrity="sha512-2AL/VEauKkZqQU9BHgnv48OhXcJPx9vdzxN1JrKDVc4FPU/MEE/BZ6d9l0mP7VmvLsjtYwqiYQpDskK9dG8KBA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="resume.js"></script>
</head>

<body id="main" data-bind="attr:{display:display}">
    <ef-print-document class="ef-dense resume resume--executive">
        <header class="ef-identity">
            <h1 data-bind="text: name"></h1>
            <address>
                <span data-bind="text: phoneNumber(phone)"></span>
                <span data-bind="text: email"></span>
                <!-- ko if: stackoverflow.display -->
                <a target="_blank" data-bind="text: stackoverflow.href, attr: { href: stackoverflow.href }"></a>
                <!-- /ko -->
                <a target="_blank" data-bind="text: website, attr: { href: website }"></a>
            </address>
        </header>

        <section class="resume-about" aria-label="About" data-bind="foreach: about">
            <p data-bind="text: $data"></p>
        </section>

        <section class="resume-lead-section resume-highlights" aria-labelledby="career-highlights">
            <h2 id="career-highlights" class="resume-subhead">Career Highlights</h2>
            <ul class="ef-lead-list" data-marker="none" data-bind="foreach: highlights">
                <li data-bind="text: $data.text"></li>
            </ul>
        </section>

        <hr>

        <section class="resume-lead-section resume-experience" aria-labelledby="leadership-experience">
            <h2 id="leadership-experience" class="resume-subhead">Leadership Experience</h2>
            <!-- ko foreach: employment.filter(x => !x.entryOnly) -->
            <article class="ef-entry" data-bind="template: { name: 'executive-entry' }"></article>
            <!-- /ko -->

            <!-- ko if: $data.previousRoles -->
            <article class="ef-entry">
                <header class="ef-row">
                    <h3>Previous Roles</h3>
                    <p data-row-end>
                        <time data-bind="attr: { datetime: isoDate(previousRoles.start) }, text: displayDate(previousRoles.start)"></time>
                        -
                        <time data-bind="attr: { datetime: isoDate(previousRoles.end) }, text: displayDate(previousRoles.end)"></time>
                    </p>
                </header>
            </article>
            <!-- /ko -->
        </section>

        <section aria-labelledby="entrepreneurial-ventures">
            <h2 id="entrepreneurial-ventures">Entrepreneurial Ventures</h2>
            <!-- ko foreach: entrepreneurialVentures -->
            <article class="ef-entry" data-bind="template: { name: 'executive-entry' }"></article>
            <!-- /ko -->
        </section>

        <!-- ko if: projects.length -->
        <section aria-labelledby="projects">
            <h2 id="projects">Projects</h2>
            <ul class="resume-items" data-bind="foreach: projects">
                <li>
                    <h3 data-bind="text: institution"></h3>
                    <div class="ef-row">
                        <p><span data-bind="text: name"></span> - <span data-bind="text: description"></span></p>
                        <p data-row-end><time data-bind="attr: { datetime: isoDate(end) }, text: displayDate(end)"></time></p>
                    </div>
                </li>
            </ul>
        </section>
        <!-- /ko -->

        <section aria-labelledby="volunteering">
            <h2 id="volunteering">Volunteering</h2>
            <ul class="resume-items" data-bind="foreach: volunteering.toSorted(sortByImportanceHigh)">
                <li>
                    <h3 data-bind="text: institution"></h3>
                    <div class="ef-row">
                        <p data-bind="text: name"></p>
                        <p data-row-end data-bind="template: { name: 'year-range' }"></p>
                    </div>
                </li>
            </ul>
        </section>

        <section aria-labelledby="specializations">
            <h2 id="specializations">Specializations</h2>
            <ul class="resume-items" data-bind="foreach: focus.toSorted(sortByImportanceHigh)">
                <li data-bind="text: $data.name"></li>
            </ul>
        </section>

        <section aria-labelledby="technologies">
            <h2 id="technologies">Technologies</h2>
            <ul class="ef-category-grid resume-technologies" data-bind="foreach: getActiveTechnologyGroupings(technologies)">
                <li>
                    <h3 data-bind="text: $data.name"></h3>
                    <ul data-bind="foreach: getTechnologyNames($data)">
                        <li data-bind="text: $data"></li>
                    </ul>
                </li>
            </ul>
        </section>

        <section aria-labelledby="education">
            <h2 id="education">Education</h2>
            <ul class="resume-items" data-bind="foreach: education">
                <li>
                    <h3 data-bind="text: institution"></h3>
                    <div class="ef-row">
                        <div class="resume-degree">
                            <span data-bind="text: degree"></span>
                            <ul class="ef-inline-list" data-bind="foreach: study">
                                <li data-bind="text: $data"></li>
                            </ul>
                        </div>
                        <p data-row-end data-bind="template: { name: 'year-range' }"></p>
                    </div>
                    <ul class="resume-education-awards" data-bind="foreach: awards">
                        <li data-bind="text: $data"></li>
                    </ul>
                </li>
            </ul>
        </section>

        <section aria-labelledby="awards">
            <h2 id="awards">Awards and Distinctions</h2>
            <ul class="resume-awards" data-bind="foreach: awards.toSorted(sortByImportanceHigh)">
                <li><strong><span data-bind="text: institution"></span> -</strong> <span data-bind="text: [description, name, end.year].join(', ')"></span></li>
            </ul>
        </section>

        <ef-print-keep>
            <section aria-labelledby="speaking">
                <h2 id="speaking">Selected Speaking Topics</h2>
                <ul class="ef-lead-list resume-speaking" data-marker="none" data-bind="foreach: selectedSpeakingTopics">
                    <li><strong><span data-bind="text: $data.highlight"></span>:</strong> <span data-bind="text: $data.details"></span></li>
                </ul>
            </section>
        </ef-print-keep>
    </ef-print-document>

    <template id="executive-entry">
        <header class="ef-row">
            <h3 data-bind="text: company"></h3>
            <p class="resume-roles" data-bind="foreach: title">
                <span data-bind="text: $data.name + ($index() < $parent.title.length - 1 ? ',' : '')"></span>
            </p>
            <p data-row-end data-bind="template: { name: 'month-range' }"></p>
        </header>
        <!-- ko if: executiveAccomplishments.filter(x => !x.hide).length -->
        <ul class="ef-lead-list" data-bind="foreach: executiveAccomplishments.filter(x => !x.hide)">
            <li><strong data-bind="text: $data.highlight"></strong> <span data-bind="text: $data.details"></span></li>
        </ul>
        <!-- /ko -->
        <!-- ko if: $data.focusAreas && focusAreas.display -->
        <dl class="ef-labeled">
            <dt>Focus Areas:</dt>
            <dd>
                <ul class="ef-inline-list resume-focus" data-bind="foreach: focusAreas.entries">
                    <li data-bind="text: name"></li>
                </ul>
            </dd>
        </dl>
        <!-- /ko -->
    </template>

    <template id="month-range">
        <time data-bind="attr: { datetime: isoDate(start) }, text: displayDate(start)"></time>
        -
        <!-- ko if: $data.end -->
        <time data-bind="attr: { datetime: isoDate(end) }, text: displayDate(end)"></time>
        <!-- /ko -->
        <!-- ko ifnot: $data.end -->Present<!-- /ko -->
    </template>

    <template id="year-range">
        <time data-bind="attr: { datetime: start.year }, text: start.year"></time>
        -
        <time data-bind="attr: { datetime: end.year }, text: end.year"></time>
    </template>
</body>

</html>
